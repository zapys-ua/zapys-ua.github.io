<style>
:root{--c:#1F4D3A;--ink:#14120E;--paper:#F4F1EA;--card:#FFFDF8;--mute:#6B6358;--line:rgba(20,18,14,.12);--disp:"Playfair Display",Georgia,serif;--text:"Golos Text",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--text);overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--disp);font-weight:700;line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
p{text-wrap:pretty}
[id]{scroll-margin-top:110px}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 22px;border-radius:999px;border:1.5px solid transparent;font:600 15px var(--text);transition:transform .16s var(--ease),background .2s}
.btn:active{transform:scale(.97)}
.btn-c{background:var(--c);color:#fff}
.btn-w{background:#fff;color:var(--ink)}
.btn-o{border-color:currentColor;background:transparent}

/* Плашка демо Avenue */
.demo-bar{background:var(--ink);color:#F5F0E6;font-size:13px;text-align:center;padding:9px 16px}
.demo-bar a{color:#E8835A;font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* Шапка поверх фото */
.top{position:fixed;left:0;right:0;top:0;z-index:20;transition:background .3s,box-shadow .3s,color .3s;color:#fff}
.top.solid{background:var(--paper);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:68px}
.brand{font:700 22px/1 var(--disp);letter-spacing:-.01em}
.nav{display:none;gap:28px;font-size:14px}
.nav a{opacity:.85}
.nav a:hover{opacity:1}
.top .btn{min-height:44px;padding:9px 18px;font-size:14px;background:var(--c);color:#fff}

/* Перший екран у рамці */
.hero{position:relative;padding:0;height:min(92svh,860px);min-height:560px}
.hero-in{position:absolute;inset:0;overflow:hidden;background:#222}
.hero-in img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 2.4s var(--ease)}
.ready .hero-in img{transform:scale(1)}
.hero-in::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 45%,rgba(0,0,0,.72) 100%)}
.hero-txt{position:absolute;left:0;right:0;bottom:0;z-index:2;color:#fff;padding:0 0 40px}
.hero-txt .kick{font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;margin-bottom:12px}
.hero-txt h1{font-size:clamp(52px,14vw,150px);line-height:.92;margin-bottom:16px}
.hero-txt p{font-size:18px;max-width:30em;opacity:.92;margin-bottom:22px}
.hero-txt .row{display:flex;flex-wrap:wrap;gap:10px}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:22px;font-size:14px;opacity:.9}
.facts span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:8px;vertical-align:2px}
.js .up{opacity:0;transform:translateY(22px);transition:opacity .9s var(--ease),transform 1s var(--ease)}
.ready .up{opacity:1;transform:none}
.ready .up.d2{transition-delay:.12s}.ready .up.d3{transition-delay:.24s}

/* Секції */
section{padding:clamp(64px,10vw,120px) 0}
.kick2{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--c);margin-bottom:12px}
.h2{font-size:clamp(36px,7vw,72px);margin-bottom:16px}
.lead{color:var(--mute);font-size:18px;max-width:34em;margin-bottom:40px}
.js .rv{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .9s var(--ease)}
.js .rv.in{opacity:1;transform:none}

/* Меню послуг */
.menu{display:grid;gap:40px}
.cat h3{font-size:28px;margin-bottom:6px}
.cat>p{color:var(--mute);font-size:14px;margin-bottom:14px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line)}
.item .n{font-weight:600;font-size:17px;display:flex;align-items:baseline;gap:10px;min-width:0}
.item .n::after{content:"";flex:1;border-bottom:1.5px dotted var(--line);transform:translateY(-4px);min-width:16px}
.item .p{font:700 22px var(--disp);white-space:nowrap}
.item .m{color:var(--mute);font-size:14px}
.item button{justify-self:end;background:none;border:0;color:var(--c);font-weight:600;font-size:14px;padding:6px 0;text-decoration:underline;text-underline-offset:3px}

/* Переваги */
.perks{display:grid;gap:12px;margin-top:56px}
.perk{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.perk b{display:block;font:700 20px var(--disp);margin-bottom:6px}
.perk p{color:var(--mute);font-size:15px}

/* Майстри */
.dark{background:var(--ink);color:#F5F0E6}
.dark .kick2{color:#E8B58F}
.dark .lead{color:#B9B0A3}
.team{display:grid;gap:16px}
.mst{position:relative;border-radius:22px;overflow:hidden;background:#2A251D;aspect-ratio:4/5}
.mst img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.mst:hover img{transform:scale(1.04)}
.mst .cap{position:absolute;left:0;right:0;bottom:0;padding:20px;background:linear-gradient(0deg,rgba(0,0,0,.75),rgba(0,0,0,0));color:#fff}
.mst .cap b{display:block;font:700 28px var(--disp)}
.mst .cap span{font-size:14px;opacity:.85}
.mst.mono{display:grid;place-items:center;background:var(--c)}
.mst.mono i{font:700 120px/1 var(--disp);font-style:normal;color:rgba(255,255,255,.9)}

/* Роботи */
.strip{--pad:max(16px,calc((100vw - 1200px) / 2 + 16px));display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 var(--pad) 8px;scroll-padding-inline:var(--pad);scrollbar-width:none;cursor:grab}
.strip::-webkit-scrollbar{display:none}
.strip figure{flex:0 0 78%;max-width:440px;scroll-snap-align:start;border-radius:20px;overflow:hidden;aspect-ratio:4/5;background:#ddd}
.strip img{width:100%;height:100%;object-fit:cover}

/* Сертифікат-квиток */
.gift{display:grid;gap:28px;align-items:center}
.tkt{position:relative;background:var(--c);color:#fff;border-radius:24px;padding:28px 26px;overflow:hidden}
.tkt::before,.tkt::after{content:"";position:absolute;top:62%;width:28px;height:28px;border-radius:50%;background:var(--paper);transform:translateY(-50%)}
.tkt::before{left:-14px}.tkt::after{right:-14px}
.tkt small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.tkt b{display:block;font:700 clamp(40px,9vw,64px)/1 var(--disp);margin:14px 0 28px}
.tkt hr{border:0;border-top:1.5px dashed rgba(255,255,255,.4);margin-bottom:16px}
.tkt .row{display:flex;justify-content:space-between;font-size:14px;opacity:.9}

/* Контакти */
.find{display:grid;gap:28px}
.hours{list-style:none;border-top:1px solid var(--line)}
.hours li{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.hours li span{color:var(--mute)}
.addr{font:700 clamp(28px,5vw,44px)/1.1 var(--disp);margin-bottom:16px}
.find .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}

footer{padding:40px 0 100px;border-top:1px solid var(--line);font-size:14px;color:var(--mute)}
footer .wrap{display:grid;gap:10px}
footer a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.big{font:700 clamp(56px,16vw,200px)/.9 var(--disp);color:var(--c);letter-spacing:-.02em;margin-bottom:24px;white-space:nowrap;overflow:hidden;text-overflow:clip}

/* Липка кнопка запису на телефоні */
.dock{position:fixed;left:12px;right:12px;bottom:12px;z-index:25;display:flex;gap:8px;transform:translateY(140%);transition:transform .5s var(--ease)}
.dock.on{transform:none}
.dock .btn{flex:1;box-shadow:0 14px 30px -12px rgba(0,0,0,.45)}

/* Вікно запису */
dialog{border:0;padding:0;margin:auto;width:min(480px,100vw);max-width:100vw;height:min(820px,100dvh);max-height:100dvh;border-radius:24px;background:var(--paper);overflow:hidden}
dialog::backdrop{background:rgba(20,18,14,.6)}
dialog .head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
dialog .x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;line-height:1}
dialog iframe{width:100%;height:calc(100% - 65px);border:0;display:block}
@media (max-width:519px){dialog{width:100vw;height:100dvh;border-radius:0}}
dialog[open]{display:flex;flex-direction:column}
dialog iframe{flex:1;height:auto}

@media (min-width:760px){
  .wrap{padding:0 28px}
  .hero{padding:12px 12px 0}
  .hero-in{inset:49px 12px 0;border-radius:28px}
  .menu{grid-template-columns:1fr 1fr;column-gap:64px}
  .perks{grid-template-columns:repeat(3,1fr)}
  .team{grid-template-columns:repeat(2,1fr)}
  .strip{--pad:max(28px,calc((100vw - 1200px) / 2 + 28px))}
  .strip figure{flex-basis:360px}
  .gift{grid-template-columns:1fr 1fr;gap:64px}
  .find{grid-template-columns:1.2fr 1fr;gap:64px}
  .dock{display:none}
}
@media (min-width:1000px){
  .nav{display:flex}
  .team{grid-template-columns:repeat(var(--n,3),1fr)}
}
@media (prefers-reduced-motion:reduce){
  .hero-in img,.js .up,.js .rv{transform:none!important;opacity:1!important;transition:none!important}
}
</style>
</head>

      return '<div class="item"><span class="n">' + esc(it[1]) + '</span><span class="p">' + fmt(it[2]) + ' грн</span><span class="m">' + it[3] + ' хв</span><button data-book="' + it[0] + '" data-name="' + esc(it[1]) + '">Записатися</button></div>';
    }).join("") + "</div>";
  }).join("") + '</div><div class="perks">' + D.perks.map(function (p) { return '<div class="perk rv"><b>' + esc(p[0]) + "</b><p>" + esc(p[1]) + "</p></div>"; }).join("") + "</div></div></section>";

if (D.team.length) {
  h += '<section id="team" class="dark"><div class="wrap"><div class="rv"><p class="kick2">Команда</p><h2 class="h2">' + esc(D.teamTitle) + '</h2><p class="lead">Оберіть майстра при записі або залиште вибір нам: запишемо до того, хто вільний раніше.</p></div><div class="team" style="--n:' + Math.min(3, D.team.length) + '">' +
    D.team.map(function (m) {
      return '<div class="mst rv' + (m[2] ? "" : " mono") + '">' + (m[2] ? '<img src="' + U(m[2], 700) + '" alt="' + esc(m[0]) + '" loading="lazy" width="700" height="875">' : "<i>" + esc(m[0].charAt(0)) + "</i>") +
        '<div class="cap"><b>' + esc(m[0]) + "</b><span>" + esc(m[1]) + "</span></div></div>";
    }).join("") + "</div></div></section>";
} else document.getElementById("nav-team").remove();

if (D.works.length >= 3) {
  h += '<section id="works" style="padding-left:0;padding-right:0"><div class="wrap rv"><p class="kick2">Роботи</p><h2 class="h2">Як це виглядає</h2><p class="lead">Гортайте вбік.</p></div><div class="strip" id="strip">' +
    D.works.map(function (w, i) { return '<figure><img src="' + U(w, 900) + '" alt="Робота ' + (i + 1) + '" loading="lazy" width="900" height="1125"></figure>'; }).join("") + "</div></section>";
} else document.getElementById("nav-works").remove();

h += '<section id="gift"><div class="wrap gift"><div class="rv"><p class="kick2">Подарунок</p><h2 class="h2">Сертифікат, який приходить як листівка</h2><p class="lead">Оберіть суму, додайте побажання і надішліть у месенджер. Людина сама обере послугу і час.</p>' +
  '<a class="btn btn-c" href="../gift/?v=' + V + '">Купити сертифікат</a></div>' +
  '<div class="tkt rv"><small>Подарунковий сертифікат</small><b>1 000 грн</b><hr><div class="row"><span>' + esc(D.name) + '</span><span>ZP-••••••</span></div></div></div></section>';

h += '<section id="find" class="dark"><div class="wrap find"><div class="rv"><p class="kick2">Як нас знайти</p><p class="addr">' + esc(D.addr) + '</p><p class="lead" style="margin-bottom:0">' + esc(D.addrNote) + '. Записатися можна будь-коли, навіть уночі.</p>' +
  '<div class="row"><button class="btn btn-w" data-book="">Записатися онлайн</button><a class="btn btn-o" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(D.addr) + '">Маршрут</a>' +
  '<a class="btn btn-o" target="_blank" rel="noopener" href="https://t.me/zapysua_demo_bot?start=' + V + '">Бот у Telegram</a></div></div>' +
  '<ul class="hours rv">' + D.hours.map(function (x) { return "<li><span>" + esc(x[0]) + "</span><b>" + esc(x[1]) + "</b></li>"; }).join("") + "</ul></div></section>";

h += '<footer><div class="wrap"><p class="big" aria-hidden="true">' + esc(D.name) + "</p><p>© " + esc(D.name) + ". Демо-бізнес: назва, адреса і фото для прикладу.</p>" +
  '<p>Сайт і онлайн-запис зроблені в <a href="../?s=' + V + '" translate="no">Avenue</a>. Фото: Unsplash.</p></div></footer>';
document.getElementById("main").innerHTML = h;

// Запис у вікні поверх сайту: сторінка запису Avenue в режимі embed, з послугою, якщо її обрали
var dlg = document.getElementById("dlg"), frame = document.getElementById("frame");
document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-book]"); if (!b) return;
  var svc = b.dataset.book;
  frame.src = "../book/?v=" + V + "&embed=1" + (svc ? "&svc=" + encodeURIComponent(svc) : "");
  document.getElementById("dlg-t").textContent = svc ? b.dataset.name : "Онлайн-запис · " + D.name;
  if (dlg.showModal) dlg.showModal(); else location.href = frame.src.replace("&embed=1", "");
});
document.getElementById("dlg-x").addEventListener("click", function () { dlg.close(); frame.src = "about:blank"; });
dlg.addEventListener("click", function (e) { if (e.target === dlg) { dlg.close(); frame.src = "about:blank"; } });

// Шапка стає суцільною після першого екрана; липка кнопка запису на телефоні
var bar = document.getElementById("top"), dock = document.getElementById("dock");
function onScroll() { var y = scrollY, hh = innerHeight * .6; bar.classList.toggle("solid", y > hh); dock.classList.toggle("on", y > hh); }
addEventListener("scroll", onScroll, { passive: true }); onScroll();

// Поява блоків і перетягування стрічки робіт мишею
if ("IntersectionObserver" in window && !RM) {
  var io = new IntersectionObserver(function (es) { es.forEach(function (x) { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }); }, { threshold: .12 });
  [].forEach.call(document.querySelectorAll(".rv"), function (el) { io.observe(el); });
} else [].forEach.call(document.querySelectorAll(".rv"), function (el) { el.classList.add("in"); });
var strip = document.getElementById("strip");
if (strip) { var sx = 0, sl = 0, down = false;
  strip.addEventListener("pointerdown", function (e) { if (e.pointerType !== "mouse") return; down = true; sx = e.clientX; sl = strip.scrollLeft; strip.style.scrollSnapType = "none"; });
  addEventListener("pointermove", function (e) { if (down) strip.scrollLeft = sl - (e.clientX - sx); });
  addEventListener("pointerup", function () { if (down) { down = false; strip.style.scrollSnapType = ""; } });
}
requestAnimationFrame(function () { document.documentElement.classList.add("ready"); });
</script>
</body>
</html>

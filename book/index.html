<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Онлайн-запис</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap">
<link rel="stylesheet" href="../assets/avenue.css">
<style>
:root{--bg:var(--tg-theme-secondary-bg-color,var(--av-paper));--card:var(--tg-theme-bg-color,var(--av-card));--text:var(--tg-theme-text-color,var(--av-ink));--mute:var(--tg-theme-hint-color,var(--av-mute));--acc:var(--tg-theme-button-color,var(--av-terra));--acct:var(--tg-theme-button-text-color,#fff);--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.4,.64,1);--soft:color-mix(in srgb,var(--acc) 8%,transparent)}
body{background:var(--bg);color:var(--text)}
svg.i{width:18px;height:18px;flex:none;vertical-align:-3px}
.lay{max-width:1080px;margin:0 auto;padding:16px 14px 120px;display:grid;gap:20px}
.embed .lay{padding-top:10px}
.col{min-width:0;max-width:600px;width:100%;margin:0 auto}

/* Шапка бізнесу */
header{display:flex;gap:14px;align-items:center;padding:6px 2px 16px}
.logo,.mono{width:58px;height:58px;border-radius:18px;flex:none}
.logo{object-fit:cover}
.mono{display:grid;place-items:center;background:var(--acc);color:var(--acct);font:700 26px/1 var(--font-display)}
h1{font:700 21px/1.15 var(--font-display);letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--mute);font-size:13px;margin-top:6px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.about{color:var(--mute);font-size:14px;margin:-6px 2px 14px}
.note.gen{color:var(--text);border-style:solid;background:color-mix(in srgb,var(--acc) 10%,transparent)}.note.gen .i{color:var(--acc)}
.note{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mute);border:1px dashed var(--line);border-radius:14px;padding:10px 13px;margin-bottom:12px}

/* Кроки */
.card{background:var(--card);border-radius:22px;padding:18px 16px;margin-bottom:12px;box-shadow:0 1px 0 var(--line)}
.card.enter{animation:in .5s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.card h2{font:700 16px/1.2 var(--font-text);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.card h2 small{margin-left:auto;font:500 12px var(--font-text);color:var(--mute)}
.n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--acc);color:var(--acct);font-size:12px;flex:none}
.n.done{background:var(--ok,#2F7A4F);color:#fff}
.card.folded{padding:14px 16px}
.card.folded h2{margin:0}
.card.folded .pick{margin-left:auto;font:600 14px var(--font-text);color:var(--text);text-align:right}
.edit{border:0!important;padding:4px 0!important;color:var(--acc)!important;font:600 13px var(--font-text)!important;margin-left:10px}
button,.btn{font:inherit;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--text);border-radius:14px;padding:10px 12px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:transform .15s var(--ease),border-color .2s,background .2s}
button:active,.btn:active{transform:scale(.97)}
.chips{display:flex;gap:8px;flex-wrap:wrap}

.svc{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;width:100%;text-align:left;margin-bottom:8px;padding:14px;border-radius:16px}
.svc:last-child{margin-bottom:0}
.svc .nm{font-weight:600;font-size:15px}
.svc .dur{font-size:12px;color:var(--mute);display:inline-flex;align-items:center;gap:5px}
.svc .pr{grid-row:1/span 2;grid-column:2;font:700 16px var(--font-text);white-space:nowrap}
.svc.on{border-color:var(--acc);background:var(--soft)}

.mst{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.mst button{flex-direction:column;gap:6px;padding:14px 10px;border-radius:18px;font-size:14px;font-weight:600}
.mst .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font:700 18px var(--font-display)}
.mst small{font-weight:500;font-size:12px;color:var(--mute);min-height:1.3em}
.mst small b{color:var(--ok,#2F7A4F);font-weight:600}
.mst button.on{border-color:var(--acc);background:var(--soft)}
.mst button.on .av{background:var(--acc);color:var(--acct)}

.near{width:100%;justify-content:flex-start;text-align:left;margin:0 0 14px;padding:13px 14px;border:1.5px solid var(--acc);background:var(--soft);font:500 14px/1.35 var(--font-text)}
.near b,.near svg{color:var(--acc)}
.month{font-size:12px;color:var(--mute);margin:0 0 8px;text-transform:capitalize}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;flex-direction:column;gap:2px;min-width:62px;padding:10px 6px;border-radius:16px}
.day small{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.day b{font:700 20px/1.1 var(--font-text)}
.day i{font-style:normal;font-size:10px;color:var(--mute)}
.day.on{background:var(--acc);border-color:var(--acc);color:var(--acct)}
.day.on small,.day.on i{color:inherit;opacity:.85}
.part{font-size:12px;font-weight:600;color:var(--mute);margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.times button{padding:11px 4px;font-weight:600;font-variant-numeric:tabular-nums}
.times button.on{background:var(--acc);color:var(--acct);border-color:var(--acc)}
.hint{font-size:13px;color:var(--mute);margin:10px 0}
.skel{height:44px;border-radius:14px;background:linear-gradient(90deg,var(--line),transparent,var(--line));background-size:200% 100%;animation:sk 1.2s linear infinite;opacity:.6}
@keyframes sk{to{background-position:-200% 0}}

.fgroup{font-size:13px;font-weight:700;margin:4px 0 10px}
label{display:block;font-size:13px;font-weight:500;color:var(--mute);margin-bottom:12px}
label small{font-weight:400}
input,select{font:inherit;font-size:16px;width:100%;margin-top:6px;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:transparent;color:var(--text);transition:border-color .2s}
input:focus,select:focus{outline:0;border-color:var(--acc)}
.plate{display:inline-flex;align-items:stretch;margin:-2px 0 14px;border:2px solid #111;border-radius:6px;background:#fff;color:#111;font:700 20px/1 var(--font-mono);letter-spacing:.06em;overflow:hidden;box-shadow:0 0 0 2px #fff,0 6px 16px -8px rgba(0,0,0,.4)}
.plate .ua{display:flex;flex-direction:column;justify-content:space-between;align-items:center;background:#0057B8;color:#fff;font-size:9px;padding:3px 4px;width:24px}
.plate .ua i{width:13px;height:9px;background:linear-gradient(#0057B8 50%,#FFD700 50%);border:1px solid #fff}
.plate span:last-child{padding:7px 12px;min-width:150px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

/* До візиту: товари під послугу */
.shelf{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.prod{flex:0 0 152px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:6px;padding:10px;border-radius:18px;position:relative}
.prod .art{height:86px;border-radius:12px;background:var(--bg);display:grid;place-items:center}
.prod .art svg{width:62px;height:62px;transition:transform .4s var(--spring)}
.prod:hover .art svg{transform:translateY(-3px) rotate(-4deg)}
.prod b{font-size:13px;line-height:1.25;font-weight:600}
.prod small{font-size:11px;color:var(--mute);line-height:1.3}
.prod .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:4px;font-weight:700;font-size:14px}
.prod .add{width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;transition:background .2s,transform .3s var(--spring)}
.prod.on{border-color:var(--acc);background:var(--soft)}
.prod.on .add{background:var(--acc);color:var(--acct);transform:rotate(135deg)}
.set{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:18px;margin-top:10px;border-style:dashed}
.set .arts{display:flex;grid-row:span 2}
.set .arts svg{width:34px;height:34px;margin-right:-10px;background:var(--bg);border-radius:50%;padding:3px;border:2px solid var(--card)}
.set b{font-size:14px}
.set small{font-size:12px;color:var(--mute);grid-column:2}
.set .pr{grid-row:1/span 2;grid-column:3;text-align:right;font-weight:700;font-size:14px;white-space:nowrap}
.set .pr s{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.set.on{border-style:solid;border-color:var(--acc);background:var(--soft)}
.tag{display:inline-block;font:700 10px/1 var(--font-text);letter-spacing:.04em;text-transform:uppercase;background:var(--acc);color:var(--acct);padding:4px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}

/* Оплата */
.payopt{display:grid;gap:8px}
.po{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;text-align:left;width:100%;padding:14px;border-radius:18px}
.po .rd{grid-row:span 2;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.po .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--acc);transform:scale(0);transition:transform .3s var(--spring)}
.po.on{border-color:var(--acc);background:var(--soft)}
.po.on .rd{border-color:var(--acc)}
.po.on .rd::after{transform:scale(1)}
.po b{font-size:15px}
.po small{grid-column:2;font-size:12px;color:var(--mute)}
.po .sv{grid-row:span 2;font:700 13px var(--font-text);color:var(--ok,#2F7A4F);background:color-mix(in srgb,var(--ok,#2F7A4F) 12%,transparent);padding:6px 8px;border-radius:10px;white-space:nowrap}
.wallets{display:flex;gap:6px;margin-top:6px;grid-column:2}
.wallets span{font:600 10px/1 var(--font-text);border:1px solid var(--line);border-radius:6px;padding:4px 6px;color:var(--mute)}
.main{width:100%;background:var(--acc);color:var(--acct);border-color:var(--acc);font-weight:700;padding:15px;font-size:16px;border-radius:16px;margin-top:6px}
.main:disabled{opacity:.6}
.gpay{margin-top:6px;min-height:52px}
.gpay button{width:100%!important}
.gpay:not(:empty)+.main{background:transparent;color:var(--text);border-color:var(--line);font-weight:600}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(1turn)}}
.err{color:var(--err,#d6453d);font-size:14px;margin-top:10px;display:flex;gap:8px;align-items:flex-start}
.fine{font-size:12px;color:var(--mute);margin-top:10px;text-align:center}

/* Квиток візиту: збирається на очах */
.tk{background:var(--card);border-radius:22px;padding:18px;position:relative;box-shadow:0 1px 0 var(--line)}
.tk::before,.tk::after{content:"";position:absolute;top:var(--cut,96px);width:20px;height:20px;border-radius:50%;background:var(--bg)}
.tk::before{left:-10px}.tk::after{right:-10px}
.tk-h{display:flex;align-items:center;gap:10px;padding-bottom:16px;margin-bottom:12px;border-bottom:1.5px dashed var(--line);min-height:80px}
.tk-h small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.tk-h b{font:700 18px/1.2 var(--font-display)}
.tk-l{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0}
.tk-l span{color:var(--mute)}
.tk-l b{text-align:right;font-weight:600}
.tk-l.new{animation:in .4s var(--ease)}
.tk-l.minus b{color:var(--ok,#2F7A4F)}
.tk-t{display:flex;justify-content:space-between;align-items:baseline;border-top:1.5px solid var(--text);margin-top:10px;padding-top:12px}
.tk-t b{font:700 26px/1 var(--font-text);font-variant-numeric:tabular-nums}
.tk-e{color:var(--mute);font-size:13px;padding:6px 0}

/* Нижня панель: одна кнопка завжди веде далі */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;transform:translateY(110%);transition:transform .4s var(--ease)}
.bar.on{transform:none}
.bar .s{flex:1;min-width:0;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .s b{display:block;font:700 18px/1.2 var(--font-text);color:var(--text)}
.bar button{background:var(--acc);color:var(--acct);border-color:var(--acc);font-weight:700;padding:13px 18px;border-radius:14px;flex:none}

/* Готово */
.ok{text-align:center;padding:26px 18px 20px}
.ok .tick{width:72px;height:72px;margin:0 auto 14px;border-radius:50%;background:var(--ok,#2F7A4F);color:#fff;display:grid;place-items:center;animation:pop .6s var(--spring) both}
.ok .tick svg{animation:pop .5s var(--spring) .15s both}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
.ok h2{font:700 24px/1.15 var(--font-display);margin-bottom:6px;display:block}
.ok>p.when{color:var(--mute);font-size:15px;margin-bottom:18px}
.ok .tk{text-align:left;background:var(--bg);box-shadow:none;margin-bottom:14px}
.ok .tk::before,.ok .tk::after{background:var(--card);top:50%}
.badge{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--font-text);padding:5px 9px;border-radius:999px;background:color-mix(in srgb,var(--ok,#2F7A4F) 14%,transparent);color:var(--ok,#2F7A4F)}
.cal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.cal .btn{font-size:13px;padding:11px 8px}
.share{width:100%;border:0;color:var(--mute);font:500 14px var(--font-text);padding:12px 0}
.again{width:100%;margin-top:8px}
.after{text-align:left;margin-top:16px;padding-top:16px;border-top:1.5px dashed var(--line)}
.after h3{font:700 15px var(--font-text);margin-bottom:10px}
.cta{text-align:center}
.cta b{font:700 17px/1.25 var(--font-display);display:block}
.cta p{color:var(--mute);font-size:14px;margin:8px 0 14px}
.cta .row{display:grid;gap:8px}
.cta .fill{background:var(--acc);color:var(--acct);border-color:var(--acc);font-weight:700}
footer{text-align:center;font-size:12px;color:var(--mute);margin-top:16px}
footer a{color:inherit}
.side{display:none}
@media (min-width:960px){
  html:not(.embed) .lay{grid-template-columns:minmax(0,600px) 360px;justify-content:center;gap:28px;padding-top:28px}
  html:not(.embed) .col{margin:0}
  html:not(.embed) .side{display:block;position:sticky;top:20px;align-self:start}
  html:not(.embed) .bar{display:none}
}
@media (prefers-reduced-motion:reduce){.card.enter,.ok .tick,.ok .tick svg,.skel,.spin,.tk-l.new{animation:none}.bar{transition:none}}
</style>
</head>

      else ph += '<p class="hint" style="margin-top:0">Оплата на місці після візиту' + (c.prepay ? ', передоплата ' + money(c.prepay) : '') + '.</p>';
      ph += S.pay === 'online' && sh ? '<div class="gpay" id="gpay"></div><button class="main" data-a="book" id="paycard"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? '<span class="spin"></span>Оплачуємо…' : ic('card') + 'Оплатити карткою · ' + money(t.total)) + '</button>'
        : '<button class="main" data-a="book"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? '<span class="spin"></span>Записуємо…' : 'Записатися на ' + fm(S.start) + (t.total ? ' · ' + money(t.total) : '')) + '</button>';
      if (S.err) ph += '<p class="err">' + ic('info') + esc(S.err) + '</p>';
      if (S.pay === 'online' && c.demo) ph += '<p class="fine">Демо: Google Pay у тестовому режимі, гроші не списуються.</p>';
      else if (S.pay === 'online') ph += '<p class="fine">Скасуєте за 2 години до візиту, і гроші повернуться на картку.</p>';
      h += card('st-p', ph);
    }
  }
  var sp = S.b === 'demo' && /^(barber|nails|sto|groom|massage|dental)$/.test(c.variant || '') ? c.variant : '';
  var site = SITE + ((sp || S.p) ? '?' + [sp ? 's=' + sp : '', S.p ? 'p=' + encodeURIComponent(S.p) : ''].filter(Boolean).join('&') : '');
  if (c.demo && !EMBED) {
    var st = c.niche || (S.b === 'demo' ? c.variant : '');
    h += card('st-cta', '<b>Хочете такий запис і сайт для свого бізнесу?</b><p>Сайт у вашому стилі, запис з оплатою і продажем товарів, бот, який повертає клієнтів. Налаштуємо за 1 день.</p><div class="row">' +
      '<a class="btn fill" data-a="ext" target="_blank" rel="noopener" href="' + site + '#zayavka">Залишити заявку</a>' +
      '<a class="btn" data-a="tgl" target="_blank" rel="noopener" href="https://t.me/avenue_studio_ua">Написати нам у Telegram</a>' + (c.bot ? '<a class="btn" data-a="tgl" target="_blank" rel="noopener" href="https://t.me/' + esc(c.bot) + (st ? '?start=' + encodeURIComponent(st) : '') + '">Спробувати бота в Telegram</a>' : '') + '</div>', 'cta');
  }
  h += '<footer>Працює на <a data-a="ext" target="_blank" rel="noopener" href="' + site + '" translate="no">Avenue</a></footer>';
  app.innerHTML = h;
  side.innerHTML = S.done ? '' : '<div class="tk">' + ticketHtml() + '</div>';
  renderBar(); mountGpay();
}

// Нижня панель: що обрано, сума і одна кнопка до наступного кроку.
function renderBar() {
  var sv = S.svc ? svc() : null, t = totals();
  if (S.done || !sv) { bar.classList.remove('on'); return; }
  var step = S.needM ? ['st-m', 'Обрати ' + V('resource', 'майстра').toLowerCase()] : S.start == null ? ['st-d', 'Обрати час'] : ['st-p', S.pay === 'online' && shop() ? 'До оплати' : 'Записатися'];
  bar.innerHTML = '<div class="s">' + esc(sv.name) + (S.start != null ? ' · ' + whenS(S.day, S.start) : '') + (lines().length ? ' · +' + lines().length + ' до візиту' : '') + '<b>' + money(t.total) + (t.off ? ' <small style="font-size:12px;color:var(--ok,#2F7A4F)">−' + SHOP.discount + '%</small>' : '') + '</b></div><button data-a="next" data-v="' + step[0] + '">' + esc(step[1]) + '</button>';
  bar.classList.add('on');
}

// Google Pay у тестовому середовищі: справжній лист Google Pay, тестова картка, гроші не рухаються.
// Для живого бізнесу шлюзом стане еквайринг monobank (Google Pay і Apple Pay у ньому вже є).
var GP = { s: 0, client: null, btn: null };
function gpReq() {
  return { apiVersion: 2, apiVersionMinor: 0, allowedPaymentMethods: [{ type: 'CARD', parameters: { allowedAuthMethods: ['PAN_ONLY', 'CRYPTOGRAM_3DS'], allowedCardNetworks: ['MASTERCARD', 'VISA'] },
    tokenizationSpecification: { type: 'PAYMENT_GATEWAY', parameters: { gateway: 'example', gatewayMerchantId: 'exampleGatewayMerchantId' } } }] };
}
function mountGpay() {
  var box = document.getElementById('gpay'); if (!box) return;
  if (GP.btn) { box.appendChild(GP.btn); return; }
  if (GP.s) return; GP.s = 1;
  var sc = document.createElement('script'); sc.src = 'https://pay.google.com/gp/p/js/pay.js'; sc.async = true;
  sc.onload = function () {
    try {
      GP.client = new google.payments.api.PaymentsClient({ environment: 'TEST' });
      GP.client.isReadyToPay(gpReq()).then(function (r) {
        if (!r.result) return;
        GP.btn = GP.client.createButton({ onClick: gpay, buttonType: 'pay', buttonColor: 'black', buttonSizeMode: 'fill', buttonLocale: 'uk', buttonRadius: 14 });
        var b2 = document.getElementById('gpay'); if (b2) b2.appendChild(GP.btn);
      }).catch(function () {});
    } catch (e) {}
  };
  document.head.appendChild(sc);
}
function gpay() {
  if (!check()) return render();
  var t = totals(), r = gpReq();
  r.merchantInfo = { merchantName: bare(S.c.title).slice(0, 40) };
  r.transactionInfo = { totalPriceStatus: 'FINAL', totalPrice: t.total.toFixed(2), currencyCode: 'UAH', countryCode: 'UA' };
  GP.client.loadPaymentData(r).then(function () { submit(true); }).catch(function () {});
}

function fieldsHtml() {
  var fs = pfields(); if (!fs.length) return '';
  var subj = S.c.pack.subject, h = '';
  function one(f) {
    var t = f.type === 'number' ? ' inputmode="numeric"' : f.type === 'plate' ? ' autocapitalize="characters" autocomplete="off" placeholder="AA 1234 BB"' : '';
    var head = '<label>' + esc(f.label) + (f.required ? '' : ' <small>(за бажанням)</small>');
    if (f.type === 'select') return head + '<select data-f="' + esc(f.key) + '"><option value="">' + (f.required ? 'Оберіть' : 'Не вказано') + '</option>' +
      (f.options || []).map(function (o) { return '<option' + (S.f[f.key] === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select></label>';
    return head + '<input data-f="' + esc(f.key) + '" maxlength="' + (f.type === 'plate' ? 12 : Math.min(f.max || 120, 200)) + '"' + t + ' value="' + esc(S.f[f.key] || '') + '"></label>' + (f.type === 'plate' ? plateHtml(S.f[f.key]) : '');
  }
  var sf = fs.filter(function (f) { return f.scope === 'subject'; }), vf = fs.filter(function (f) { return f.scope !== 'subject'; });
  if (sf.length) h += '<p class="fgroup">' + esc(subj ? subj.label : V('subject', 'Клієнт')) + '</p>' + sf.map(one).join('');
  return h + vf.map(one).join('');
}
function slots() {
  S.loading = true; S.days = null; S.day = null; S.start = null; render();
  api('slots', { svc: S.svc, m: S.m }).then(function (r) { S.days = r.days; S.day = r.days.length ? r.days[0].d : null; })
    .catch(function () { S.days = []; }).then(function () { S.loading = false; render(); go('st-d'); });
}
// Найближчий вільний час кожного майстра, щоб обирати не навмання.
function masterFree() {
  var sv = svc(); S.mfree = {};
  sv.masters.forEach(function (id) {
    api('slots', { svc: sv.id, m: id }).then(function (r) { var d = r.days && r.days[0]; S.mfree[id] = d && d.s.length ? (rel(d.d) || dp(d.d).w) + ' о ' + fm(d.s[0]) : null; })
      .catch(function () { S.mfree[id] = undefined; }).then(function () { if (S.needM && S.svc === sv.id) render(); });
  });
}
function check() {
  var nm = S.name.trim(), digits = S.phone.replace(/[^0-9]/g, '');
  if (nm.length < 2) { S.err = 'Вкажіть, будь ласка, ім\'я.'; go('st-f'); return false; }
  if (digits.length < 9) { S.err = 'Вкажіть номер телефону, наприклад +380671234567.'; go('st-f'); return false; }
  var miss = pfields().filter(function (f) { return f.required && !String(S.f[f.key] || '').trim(); })[0];
  if (miss) { S.err = 'Заповніть, будь ласка, поле «' + miss.label + '».'; go('st-f'); return false; }
  S.err = ''; return true;
}
function submit(paid) {
  if (!check()) return render();
  var sv = svc(), hp = document.getElementById('hp'), honey = hp ? hp.value : '', fv = {}, t = totals(), ln = lines();
  pfields().forEach(function (f) { var x = String(S.f[f.key] || '').trim(); if (x) fv[f.key] = f.type === 'plate' ? x.toUpperCase() : x; });
  S.busy = true; render();
  // Демо без справжнього Google Pay: імітуємо оплату карткою паузою, гроші не рухаються.
  var pre = S.pay === 'online' && shop() && !paid ? new Promise(function (r) { setTimeout(r, 900); }) : Promise.resolve();
  pre.then(function () { return api('book', { svc: S.svc, m: S.m, day: S.day, start: S.start, name: S.name.trim(), phone: S.phone, fields: fv, website: honey }); }).then(function (r) {
    ls('zp_name', S.name.trim()); ls('zp_phone', S.phone);
    S.busy = false;
    S.done = { name: sv.name, min: sv.min, day: S.day, start: S.start, master: r.master, f: fv, lines: ln, off: t.off, total: t.total, paid: S.pay === 'online' && !!shop(),
      remind: /^https:\/\/t\.me\/[A-Za-z0-9_]+\?start=r_[a-z0-9]{12}$/.test(r.remind_url || '') ? r.remind_url : null };
    if (!ln.length) S.cart = {};
    if (T && T.HapticFeedback) T.HapticFeedback.notificationOccurred('success');
    render(); window.scrollTo(0, 0);
  }).catch(function (e) {
    S.busy = false;
    if (e.message === 'busy') { var keep = 'Цей час щойно зайняли. Оберіть, будь ласка, інший.'; slots(); S.err = keep; return; }
    S.err = e.message === 'limit' ? 'Забагато записів за короткий час. Спробуйте трохи пізніше.' : e.message === 'contact' ? 'Перевірте, будь ласка, ім\'я та номер телефону.' :
      e.message === 'fields' ? 'Перевірте, будь ласка, заповнені поля.' : 'Не вдалося записатися. Спробуйте ще раз.';
    render();
  });
}
function load() {
  api('cfg').then(function (c) {
    if (c.modules && c.modules.zapis === false) throw new Error('not found');
    S.c = c; if (c.variant) S.v = c.variant;
    var b = c.brand || null;
    // Демо-сайт передає свій колір і шрифт, щоб запис виглядав частиною сайту.
    if (c.demo && /^[0-9a-fA-F]{6}$/.test(q.get('acc') || '')) b = { color: '#' + q.get('acc'), ink: '#FFFFFF', font: q.get('font') || (b && b.font), bg: /^[0-9a-fA-F]{6}$/.test(q.get('bg') || '') ? '#' + q.get('bg') : (b && b.bg) };
    brand(b);
    if (c.me) { S.name = S.name || c.me.name; S.phone = S.phone || c.me.phone; }
    document.title = 'Онлайн-запис · ' + c.title;
    var deep = DEEP && !S.svc ? c.services.filter(function (s) { return s.id === DEEP; })[0] : null;
    if (deep) {
      DEEP = ''; S.svc = deep.id;
      if (DEEPM && deep.masters.indexOf(DEEPM) > -1) { S.m = DEEPM; S.needM = false; } else S.needM = deep.masters.length > 1;
      DEEPM = '';
      if (S.needM) { masterFree(); render(); go('st-m'); } else slots(); return;
    }
    render();
  }).catch(function (e) {
    app.innerHTML = '<div class="card" style="text-align:center;margin-top:40px">' + (e.message === 'not found' ? 'Сторінку запису не знайдено.' : 'Не вдалося завантажити сторінку. Спробуйте оновити її.') + '</div>';
  });
}
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]'); if (!el) return;
  var a = el.dataset.a, v = el.dataset.v;
  if (a === 'ext' || a === 'tgl') { if (T) { e.preventDefault(); if (a === 'tgl') T.openTelegramLink(el.href); else T.openLink(el.href); } return; }
  if (a !== 'book') S.err = '';
  if (a === 'var') { S.v = v; S.svc = null; S.days = null; S.start = null; S.needM = false; S.cart = {}; seen = {}; shownLines = {}; load(); }
  else if (a === 'svc') { S.svc = v; S.m = '*'; S.days = null; S.day = null; S.start = null; S.needM = svc().masters.length > 1; if (S.needM) { masterFree(); render(); go('st-m'); } else slots(); }
  else if (a === 'unsvc') { S.svc = null; S.start = null; S.needM = false; render(); go('st-s'); }
  else if (a === 'unm') { S.needM = true; S.start = null; masterFree(); render(); go('st-m'); }
  else if (a === 'untime') { S.start = null; render(); go('st-d'); }
  else if (a === 'm') { S.m = v; S.needM = false; slots(); }
  else if (a === 'day') { S.day = v; S.start = null; render(); }
  else if (a === 'time') { S.start = Number(v); render(); go('st-f'); }
  else if (a === 'near') { S.day = S.days[0].d; S.start = S.days[0].s[0]; render(); go('st-f'); }
  else if (a === 'cart') {
    var sh = shop(), st = sh.sets.filter(function (x) { return x.id === v; })[0];
    if (st) { S.cart[v] = !S.cart[v]; st.items.forEach(function (i) { delete S.cart[i]; }); }
    else { var inSet = sh.sets.filter(function (x) { return S.cart[x.id] && x.items.indexOf(v) > -1; })[0];
      if (inSet) { delete S.cart[inSet.id]; inSet.items.forEach(function (i) { if (i !== v) S.cart[i] = true; }); } else S.cart[v] = !S.cart[v]; }
    render();
  }
  else if (a === 'reserve') { S.done.lines = lines(); S.done.total += totals().extra; render(); }
  else if (a === 'pay') { S.pay = v; render(); }
  else if (a === 'next') { if (v === 'st-p' && !(S.pay === 'online' && shop())) submit(); else go(v); }
  else if (a === 'share') share();
  else if (a === 'book') submit();
  else if (a === 'close') { if (T) T.close(); }
  else if (a === 'again') { S.done = null; S.svc = null; S.days = null; S.start = null; S.needM = false; S.cart = {}; S.pay = 'place'; seen = {}; shownLines = {}; render(); window.scrollTo(0, 0); }
});
app.addEventListener('input', function (e) {
  if (e.target.id === 'nm') S.name = e.target.value;
  if (e.target.id === 'ph') S.phone = e.target.value;
  if (e.target.dataset && e.target.dataset.f) {
    S.f[e.target.dataset.f] = e.target.value;
    var pl = e.target.parentNode.nextElementSibling;
    if (pl && pl.classList.contains('plate')) pl.querySelector('[data-plate]').textContent = (e.target.value || 'AA 0000 AA').toUpperCase();
  }
});
app.addEventListener('change', function (e) { if (e.target.dataset && e.target.dataset.f) S.f[e.target.dataset.f] = e.target.value; });
load();
</script>
</body>
